name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump to apply, or infer it from conventional commits
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions: {}

concurrency:
  group: release-and-publish
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'better-auth-ui/better-auth-ui' &&
      github.ref == 'refs/heads/main'
    name: Release
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_type: ${{ inputs.release_type }}

  publish:
    name: Publish
    needs: release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-packages.yml
    with:
      ref: ${{ needs.release.outputs.sha }}
